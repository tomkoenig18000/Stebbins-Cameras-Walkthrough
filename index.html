<title>Camera Service Walkthrough</title>
<style>

:root[data-theme="dark"]{color-scheme:dark;--bg:#2b2114;--surf:#382a19;--ink:#fff0d4;--mute:#cfb891;--line:#695035;--sage:#e2b15b;--sagebg:#4d391d;--straw:#e2b15b;--warn:#e7786a;--warnbg:#3b2521}
*{box-sizing:border-box}
html,body,button,input,select,label{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);margin:0;padding:0 16px}
.app{max-width:480px;margin:0 auto;padding-block:12px 110px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
h1,h2{font-family:var(--disp);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:22px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}h2{font-size:30px}

.c18{background:#8fb07f}.c17{background:#b7c98a}.c16{background:#e3c46b}.c15{background:#e0a072}.c0{background:#c76a5c}

.top .pill{min-height:44px;padding:7px 12px;border:1px solid var(--line);background:var(--surf);color:var(--ink)}

.home-intro{display:grid;gap:5px}.home-intro h2{font-size:28px}.mode-options{display:grid;gap:8px}.mode-options .check{margin:0}
.card details>summary{cursor:pointer;font-size:14px;color:var(--mute)}.card details[open]>.param{margin-block:12px}
.test-banner{border:1px solid #c6532f;border-radius:10px;background:#ffb18b;color:#541d0e;padding:12px 14px;display:grid;gap:3px;font-size:13px}.test-banner strong{font-size:12px;letter-spacing:.08em}
.update-banner{position:sticky;top:8px;z-index:20;align-self:start;display:grid;gap:8px;padding:14px;border:2px solid #658bbb;border-radius:12px;background:#e8f1ff;color:#173557;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.update-banner[hidden]{display:none}.update-banner strong{font-size:18px}.update-banner p{margin:0;font-size:14px}.update-banner .update-versions{font-size:12px;font-weight:600}
.update-banner button{min-height:44px;padding:10px 14px;border:0;border-radius:8px;background:#224d7e;color:#fff;font:700 16px var(--body);cursor:pointer}.update-banner button:disabled{opacity:.65;cursor:default}.update-banner button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .update-banner{background:#24364b;color:#e0edff;border-color:#779ec9}}
:root[data-theme="dark"] .update-banner{background:#24364b;color:#e0edff;border-color:#779ec9}
.test-banner[hidden]{display:none}.test-badge{display:inline-block;background:#ffb18b;color:#541d0e;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;margin-left:6px}
:root[data-testing="true"]{--bg:#fff0e8;--surf:#fff8f3;--ink:#5a2517;--mute:#8c4a36;--line:#e8b39b;--sage:#b33b1b;--sagebg:#fbd7c8;--straw:#d75326;--warn:#b02d1f;--warnbg:#ffe0d5}
@media(prefers-color-scheme:dark){:root[data-testing="true"]:not([data-theme="light"]){--bg:#301812;--surf:#422118;--ink:#ffeadd;--mute:#e3b09c;--line:#8a4a35;--sage:#ff9d72;--sagebg:#693621;--straw:#fb794b;--warn:#ffb59d;--warnbg:#5c231c}}
:root[data-theme="dark"][data-testing="true"]{--bg:#301812;--surf:#422118;--ink:#ffeadd;--mute:#e3b09c;--line:#8a4a35;--sage:#ff9d72;--sagebg:#693621;--straw:#fb794b;--warn:#ffb59d;--warnbg:#5c231c}
</style>

<div class="app">
 <div class="top"><div class="app-heading"><h1 id="siteTag">Camera service</h1><span class="app-version" id="appVersion">Version v23</span></div><span style="display:flex;gap:10px;align-items:center"><button class="pill" id="daysBtn">Home</button><span class="sync-status" id="syncPill" role="status" aria-live="polite">Synced</span></span></div>
 <section class="update-banner" id="updateBanner" role="status" aria-live="polite" hidden><strong>App update available</strong><p class="update-versions" id="updateVersions"></p><p id="updateMessage">Update before your next visit. Your current visit and saved entries will be kept on this phone.</p><button id="updateApp" type="button">Update now</button></section>
 <div class="test-banner" id="modeBanner" role="status" hidden><strong>TEST MODE</strong><span>Practice visits are flagged in the log and excluded from camera status and ArcGIS.</span></div>
 <div class="alert" id="storageBanner" role="alert" hidden><p id="storageMessage"></p><button class="btn" id="retryLocalSave">Retry phone storage</button></div>

 <main id="view"></main>
</div>

<script>
// Active site list from the Cameras tab (2026-10-27), alphabetized: name, camera, brand, last settings, usual interval (wk). No coordinates or lock codes.
const SITES=[["Annie's Junction","QR10","R","Delay 2 min (8/26)",8],["Annie's Rock Junction","QR7","R","Delay 2 min (8/26)",8],["Big Pool","QR3","R","?",12],["Coolers Bench","NRS 12","B","Delay 1 min (9/2)",6],["Cottonwood Confluence","CSS6","R","?",8],["Coyote Canyon Confluence","QR9","R","?",8],["East Homestead (Steve's Cam)","CT4","R","?",12],["High Coyote Canyon","CSS3","R","Pause 1 min (6/14)",10],["Lion Pool","QR6","R","?",12],["Live Oak","QRL4","R","Video OFF (9/2)",12],["Lower Wildhorse","HP4K2","R","?",12],["Middle Coyote Canyon Buckeye","NRS 06","B","2-shot, 5 min delay (9/2)",8],["Middle Coyote Canyon Toyon","NRS 04","B","Trail cam, 80 ft, 5 min delay, 3-shot (6/24)",8],["North Homestead","HP4K3","R","Pause 1 min; video OFF (9/2)",8],["Ridge","CT3","R","?",12],["Riverlapse","NRS 14","B","Timelapse+ 30 min?",8],["Scout's Chair","QR1","R","Delay 0? — check",8],["Sentinel Site","CRR-2-ML","R","?",8],["South Point","QR2","R","Check delay (quiet 1 min set 5/2025)",8],["Spencer","CSS4","R","?",12],["Stone Bridge","NG24","R","?",8],["Test Site 4","CSS2","R","?",8],["Toponce","CJT2","R","?",12],["Upper Cold Canyon","CT2","R","Delay 1 min (6/13)",12]];
const STEPS=[{k:'arrive',t:'Arrive'},{k:'batt',t:'Batteries'},{k:'card',t:'Card'},{k:'set',t:'Settings'},{k:'trim',t:'Trim'},{k:'pos',t:'Reposition'},{k:'arm',t:'Arm & lock'},{k:'notes',t:'Save'}];
const PDEF={highRate:2000,stopDays:7,targetFill:80,defaultWeeks:8,recDelay:1,delayFactor:35,videoFactor:25,trimFactor:80};
const PINFO=[['highRate','High trigger rate','pictures a week that counts as too many'],['stopDays','Stopped-early warning','days between the last picture and the visit'],['targetFill','Target card fill','% full the card should be at the next visit'],['defaultWeeks','Default interval','weeks to the next visit when the site has none'],['recDelay','Suggested delay','minutes, when the delay was 0'],['delayFactor','Delay added','% of pictures left after going from no delay to a delay'],['videoFactor','Video turned off','% of card space left after turning video off'],['trimFactor','Vegetation trimmed','% of pictures left after trimming']];
const V=['1.8','1.7','1.6','1.5','dead'],VC=['c18','c17','c16','c15','c0'];
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
let preferredName='';
const blank=()=>({servicedBy:preferredName,date:today(),site:'',other:'',brand:'R',state:'',unlocked:false,obs:'',out:[0,0,0,0,0],inMode:'',inn:[0,0,0,0,0],pics:'',gb:'',size:'',weeks:'',first:'',last:'',imported:false,newCard:'',nextWeeks:'',delayFrom:'',delayTo:'',video:'',other2:'',clock:false,trimmed:false,trimNote:'',trimPhoto:false,moved:false,photoPlace:false,photoView:false,armed:false,locked:false,extra:'',batteriesChanged:false,cardChanged:false,settingsChanged:false,photosTaken:false,lensCleaned:false});
let P={...PDEF},homeTab='visits',stash=null,flash='',pushing=false,S,step=0,days=false,dayPick='',queue=[],sent=[],cfg={url:'',key:''},showCfg=false,connectionDraft=null,preferencesOpen=false,siteError=false,pushAgain=false,discardConfirmation='',saveConfirmation='',uploadStatus={kind:'',message:''};
const STATE_KEY='cam-state',STATE_SCHEMA=1;
let persistedBundle=null,stateReadError='';
try{const raw=localStorage.getItem(STATE_KEY);if(raw){const parsed=JSON.parse(raw);if(parsed.schema!==STATE_SCHEMA||!parsed.values||typeof parsed.values!=='object'||Array.isArray(parsed.values))throw Error('unknown saved format');persistedBundle=parsed.values}}catch(e){stateReadError='Saved phone data could not be read. Keep this page open; do not clear browser data.'}
const L=k=>{if(stateReadError)return null;if(persistedBundle)return Object.prototype.hasOwnProperty.call(persistedBundle,k)?persistedBundle[k]:null;try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
preferredName=String(L('cam-serviced-by')||'').trim();
S=L('cam-visit')||blank();if(!S.editId&&S.servicedBy===undefined)S.servicedBy=preferredName;queue=L('cam-queue')||[];sent=L('cam-sent')||[];cfg=L('cam-cfg')||cfg;P={...PDEF,...(L('cam-params')||{})};step=L('cam-step')||0;stash=L('cam-stash');
let streamlined=L('cam-streamlined')!==false,testing=L('cam-testing')===true;
const isTestVisit=()=>testing||S.test===true;
// Every upload before v16 was a user-confirmed test. Preserve this on retries and edits.
for(const r of [...queue,...sent])if(typeof r.test!=='boolean'){r.test=true;r.type='Test';r.notes='[TEST] '+(r.notes||'');r.line='[TEST] '+(r.line||'');if(r.st)r.st.test=true}
// Keep a pre-update detailed draft in its original form. New visits default to quick mode.
if(!S.formMode&&(S.editId||S.pics||S.gb||S.newCard||S.inMode||S.out.some(Boolean)||S.inn.some(Boolean)))S.formMode='detailed';
const quick=()=>S.formMode?S.formMode==='quick':streamlined;
function storageNotice(message=''){
 const box=document.getElementById('storageBanner');box.hidden=!message;document.getElementById('storageMessage').textContent=message;
}
function save(overrides={}){
 if(stateReadError){storageNotice(stateReadError);return false}
 const values={'cam-visit':S,'cam-queue':queue,'cam-sent':sent.slice(-300),'cam-cfg':cfg,'cam-params':P,'cam-step':step,'cam-stash':stash,'cam-streamlined':streamlined,'cam-testing':testing,'cam-serviced-by':preferredName,...overrides};
 try{localStorage.setItem(STATE_KEY,JSON.stringify({schema:STATE_SCHEMA,values}));persistedBundle=values;
  // Keep best-effort legacy copies for older cached app shells. The complete snapshot above is authoritative.
  for(const [key,value] of Object.entries(values))try{localStorage.setItem(key,JSON.stringify(value))}catch(e){}
  storageNotice();return true;
 }catch(e){storageNotice('Your latest changes could not be saved on this phone. Keep this page open to avoid losing them, then try saving again.');return false}
}

const nb=()=>S.brand==='B'?6:12;
const site=()=>S.site==='__other'?S.other.trim():S.site;
const siteInfo=()=>SITES.find(s=>s[0]===S.site);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
function grp(a,dir){if(!sum(a))return'';const n=a.map((c,i)=>c?`${c} ${V[i]}`:'').filter(Boolean);
 if(n.length===1&&sum(a)===nb())return`all ${n[0].split(' ')[1]} ${dir}`;return n.join(', ')+' '+dir}
function calcWeeks(){if(!S.first||!S.last)return'';const w=(new Date(S.last+'T12:00')-new Date(S.first+'T12:00'))/6048e5;return w>=0?String(Math.round(w*10)/10):''}
function daysAgo(d){return d?Math.round((new Date((S.date||today())+'T12:00')-new Date(d+'T12:00'))/864e5):null}
const SIZES=[32,64,128,256,512];
function nextW(){const si=siteInfo();return +S.nextWeeks||(si&&si[4])||P.defaultWeeks}
function factor(){let f=1;const why=[];if(S.delayFrom!==''&&+S.delayFrom===0&&+S.delayTo>0){f*=P.delayFactor/100;why.push('delay added')}
 if(S.video==='off'){f*=P.videoFactor/100;why.push('video off')}if(S.trimmed){f*=P.trimFactor/100;why.push('trimmed')}return{f,why}}
function proj(){const g=+S.gb,w=+S.weeks;if(!(g>0&&w>0))return null;const {f,why}=factor(),n=nextW(),need=g/w*f*n,cap=P.targetFill/100;

 const status=document.getElementById('syncPill');status.textContent=queue.length?`${navigator.onLine?'':'Offline · '}${queue.length} waiting`:(cfg.url?(navigator.onLine?'All uploaded':'Offline'):'Not connected');status.className='sync-status'+(queue.length||!cfg.url||!navigator.onLine?' pending':'');
 if(days)return renderDays();
 if(quick()){
  document.getElementById('chips').innerHTML='';document.getElementById('chips').hidden=true;
  document.getElementById('view').innerHTML=(flash?`<div class="ok" role="status" style="margin-bottom:10px">${esc(flash)}</div>`:'')+`<div class="card">${quickForm()}</div>`;flash='';
  document.getElementById('siteTag').textContent=site()||'Camera service';
  const nx=document.getElementById('next');nx.textContent=confirmingSave()?'Save anyway':S.editId?'Save changes':'Save visit';document.getElementById('back').hidden=true;document.getElementById('daysBtn').textContent='Home';save();return
 }
 document.getElementById('chips').hidden=false;
 document.getElementById('chips').innerHTML=STEPS.map((s,i)=>`<button data-go="${i}" class="${done(s.k)?'done':''}" aria-current="${i===step}">${s.t}</button>`).join('');
 document.getElementById('view').innerHTML=(flash?`<div class="ok" style="margin-bottom:10px">${esc(flash)}</div>`:'')+`<div class="card">${R[STEPS[step].k]()}</div>`;flash='';
 document.getElementById('siteTag').textContent=site()||'Camera service';
 const bk=document.getElementById('back'),nx=document.getElementById('next');bk.hidden=false;bk.disabled=step===0;
 nx.textContent=step===STEPS.length-1?(confirmingSave()?'Save anyway':S.editId?'Save changes':'Save visit'):'Next ›';
 document.getElementById('daysBtn').textContent='Home';
 document.querySelector('.chips [aria-current="true"]')?.scrollIntoView({inline:'center',block:'nearest'});
 const imp=document.getElementById('imp');if(imp)imp.onchange=readCard;
 save()}
function go(i){resetConfirmations();days=false;step=Math.max(0,Math.min(STEPS.length-1,i));render();window.scrollTo(0,0)}

function readCard(e){const f=[...e.target.files].filter(x=>/\.(jpe?g|mp4|avi|mov)$/i.test(x.name));if(!f.length)return;
 const iso=ms=>ymd(new Date(ms));
 const ph=f.filter(x=>/\.jpe?g$/i.test(x.name));if(!ph.length)return;const pt=ph.map(x=>x.lastModified).sort((a,b)=>a-b);
 S.pics=String(ph.length);S.gb=(sum(f.map(x=>x.size))/1e9).toFixed(1);S.first=iso(pt[0]);S.last=iso(pt[pt.length-1]);
 S.weeks=calcWeeks();S.imported=true;render()}

function refreshSyncStatus(){
 const status=document.getElementById('syncPill'),message=document.getElementById('syncMsg');
 status.textContent=queue.length?`${navigator.onLine?'':'Offline · '}${queue.length} waiting`:(cfg.url?(navigator.onLine?'All uploaded':'Offline'):'Not connected');status.className='sync-status'+(queue.length||!cfg.url||!navigator.onLine?' pending':'');
 if(pushing){status.textContent='Uploading…';if(message)message.textContent='Uploading visits…';return}
 if(uploadStatus.kind==='error'&&queue.length){status.textContent='Upload failed';status.className='sync-status pending'}
 if(message&&uploadStatus.message&&(uploadStatus.kind!=='success'||(!S.site&&!S.extra&&!S.editId))){message.textContent=uploadStatus.message;if(uploadStatus.kind==='error')message.setAttribute?.('role','alert')}
}
async function push(){if(pushing||!queue.length||!cfg.url||!navigator.onLine)return;pushing=true;pushAgain=false;const snapshot=queue.slice();let batch=snapshot,blocked='',succeeded=false;
 uploadStatus={kind:'pending',message:'Uploading visits…'};refreshSyncStatus();
 try{if(batch.some(r=>r.test)){
   const cap=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:cfg.key,action:'capabilities'})});
   let support;try{support=JSON.parse(await cap.text())}catch(e){}
   if(!support?.capabilities?.testMode){blocked='Test visits are kept on this phone: the log connection needs its testing-mode update.';batch=snapshot.filter(r=>!r.test);if(!batch.length)throw Error(blocked)}
  }
  const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:cfg.key,rows:batch})});
  const tx=await r.text();let j;try{j=JSON.parse(tx)}catch(e){throw Error('the log sent back a web page, not a reply. Check the address ends in /exec')}if(!j.ok)throw Error(j.error||'rejected');
  const done=new Set(j.saved||batch.map(q=>q.id)),ok=q=>done.has(q.id)&&batch.includes(q),accepted=queue.filter(ok),nextQueue=queue.filter(q=>!ok(q)),nextSent=[...sent,...accepted];
  if(!save({'cam-queue':nextQueue,'cam-sent':nextSent.slice(-300)}))throw Error('The log received the upload, but its receipt could not be saved on this phone. Keep this page open; retries use the same visit IDs.');
  sent=nextSent;queue=nextQueue;succeeded=true;
  uploadStatus={kind:blocked?'error':queue.length?'pending':'success',message:blocked||(queue.length?`${queue.length} visit${queue.length===1?'':'s'} still waiting to upload.`:'Uploaded to the Camera Log.')};
 }catch(err){uploadStatus={kind:'error',message:`Couldn't finish uploading: ${err.message} Visits remain on this phone.`}}
 finally{pushing=false;refreshSyncStatus();if(days&&homeTab==='visits'&&document.activeElement?.tagName!=='SELECT')render();if(succeeded&&pushAgain&&queue.length&&navigator.onLine){pushAgain=false;Promise.resolve().then(push)}}
}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id!=='discard'&&b.id!=='saveVisit'&&b.id!=='next')resetConfirmations();
 if(b.dataset.today){S.date=today();return render()}
 if(b.dataset.go)return go(+b.dataset.go);
 if(b.dataset.tab){homeTab=b.dataset.tab;return render()}
 if(b.id==='resetP'){P={...PDEF};save();return render()}
 if(b.id==='daysBtn'){days=!days;return render()}
 if(b.dataset.open){const r=[...queue,...sent].find(x=>x.id===b.dataset.open);if(r&&r.st){if(!S.editId&&(S.site||S.extra||S.pics||sum(S.out)))stash={S:JSON.parse(JSON.stringify(S)),step};siteError=false;S={...blank(),...JSON.parse(JSON.stringify(r.st)),servicedBy:r.st.servicedBy||'',formMode:r.st.formMode||'detailed',editId:r.id};days=false;step=STEPS.length-1;render();window.scrollTo(0,0);return}}
 if(b.id==='closeDays'){days=false;return render()}
 if(b.id==='copyDay'){const t=[...sent,...queue].filter(r=>r.date===dayPick).map(r=>r.line).join('\n');navigator.clipboard?.writeText(t).then(()=>b.textContent='Copied',()=>{});return}
 if(b.dataset.seg){const f=b.dataset.seg;S[f]=(S[f]===b.dataset.v&&f!=='brand'&&f!=='inMode')?'':b.dataset.v;return render()}
 if(b.dataset.d){const a=S[b.dataset.c],i=+b.dataset.i;a[i]=Math.max(0,(+a[i]||0)+ +b.dataset.d);return render()}
 if(b.id==='saveVisit')return saveVisit(b);
 if(b.id==='discard'){if(discardConfirmation!==confirmationKey()){discardConfirmation=confirmationKey();b.textContent='Tap again to discard';return}resetConfirmations();const wasEdit=S.editId;siteError=false;S=blank();step=0;if(wasEdit&&stash){S=stash.S;step=stash.step;stash=null}flash=wasEdit?'Edit discarded. The saved visit is unchanged.':'Visit discarded.';return render()}
 if(b.id==='pushNow')return push();
 if(b.id==='cfgBtn'){showCfg=!showCfg;connectionDraft=showCfg?{...cfg}:null;return render()}
 if(b.id==='retryLocalSave')return save();
 if(b.id==='cfgTest'){const u=document.getElementById('cfgUrl').value.trim(),k=document.getElementById('cfgKey').value;alertMsg('Testing…');fetch(u+(u.includes('?')?'&':'?')+'key='+encodeURIComponent(k)).then(r=>r.text()).then(t=>{let j;try{j=JSON.parse(t)}catch(e){throw new Error('got a web page instead of the log. Check the address ends in /exec and access is set to Anyone')}alertMsg(j.ok?'Connected to '+j.sheet+'.':'The log answered: '+j.error)}).catch(err=>alertMsg('Test failed: '+err.message));return}
 if(b.id==='cfgSave'){const nextCfg={url:document.getElementById('cfgUrl').value.trim(),key:document.getElementById('cfgKey').value};if(!save({'cam-cfg':nextCfg}))return;cfg=nextCfg;connectionDraft=null;showCfg=false;uploadStatus={kind:'',message:''};render();push()}
});
function saveVisit(b){if(!S.date)S.date=today();if(!site()){step=0;siteError=true;render();document.querySelector(`[data-f="${S.site==='__other'?'other':'site'}"]`)?.focus();return}
 if(missing().length&&!confirmingSave()){saveConfirmation=confirmationKey();render();document.getElementById('visitWarnings')?.focus({preventScroll:false});return}
 const nr=row(),name=(nr.test?'Test visit at ':'')+site(),wasEdit=S.editId;
 const nextQueue=[...queue.filter(q=>q.id!==nr.id),nr],nextSent=sent.filter(q=>q.id!==nr.id);
 const nextVisit=wasEdit&&stash?stash.S:blank(),nextStep=wasEdit&&stash?stash.step:0,nextStash=wasEdit&&stash?null:stash;
 if(!save({'cam-queue':nextQueue,'cam-sent':nextSent,'cam-visit':nextVisit,'cam-step':nextStep,'cam-stash':nextStash})){saveConfirmation='';b.textContent=wasEdit?'Save changes':'Save visit';return}
 resetConfirmations();siteError=false;queue=nextQueue;sent=nextSent;S=nextVisit;step=nextStep;stash=nextStash;
 flash=wasEdit?`Changes to ${name} saved.${site()?' Back to '+site()+'.':''}`:`${name} saved. Ready for the next camera.`;render();window.scrollTo(0,0);if(pushing)pushAgain=true;push()}

function alertMsg(t){const m=document.getElementById('syncMsg');if(m){m.textContent=t;if(t.startsWith('Still unchecked:'))m.setAttribute?.('role','alert')}}
function fieldInput(t){
 resetConfirmations();
 if(t.id==='cfgUrl'||t.id==='cfgKey'){connectionDraft=connectionDraft||{...cfg};connectionDraft[t.id==='cfgUrl'?'url':'key']=t.value;return}
 if(t.id==='preferredName'){preferredName=t.value.trim();if(!S.editId)S.servicedBy=t.value;save();return}
 if(t.id==='streamlinedMode'){streamlined=t.checked;S.formMode=streamlined?'quick':'detailed';step=0;save();return render()}
 if(t.id==='testingMode'){testing=t.checked;if(!S.editId)S.test=testing;save();return render()}
 if(t.dataset.p){const v=parseFloat(t.value);if(!isNaN(v)&&v>=0){P[t.dataset.p]=v;save()}return}
 if(t.dataset.c){S[t.dataset.c][+t.dataset.i]=Math.max(0,parseInt(t.value)||0);save();const k=t.dataset.c,el=t.closest('.count').nextElementSibling;if(el){const s=sum(S[k]);el.textContent=`${s} of ${nb()}`;el.className='tot'+(s&&s!==nb()?' bad':'')}return}
 const f=t.dataset.f;if(!f)return;S[f]=t.type==='checkbox'?t.checked:t.value;
 if(f==='servicedBy'&&!S.editId)preferredName=t.value.trim();
 if(f==='site'){const si=siteInfo();if(si)S.brand=si[2]}
 if((f==='site'||f==='other')&&siteError&&site()){siteError=false;if(f==='other')return render()}
 if(f==='first'||f==='last')S.weeks=calcWeeks();
 if(t.type==='checkbox'||t.tagName==='SELECT'||t.type==='date'){render()}else{save();const warnings=document.getElementById('visitWarnings');if(warnings)warnings.outerHTML=readinessWarnings();const ch=document.getElementById('cardHints');if(ch)ch.innerHTML=cardHints();const sp=document.getElementById('setProj');if(sp)sp.innerHTML=projHtml();document.getElementById('siteTag').textContent=site()||'Camera service'}
}
document.addEventListener('input',e=>{if(e.target.tagName==='SELECT'||e.target.type==='date'||e.target.type==='file')return;fieldInput(e.target)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='dayPick'){resetConfirmations();dayPick=t.value;return render()}if(t.tagName==='SELECT'||t.type==='date')fieldInput(t)});
document.getElementById('back').onclick=()=>go(step-1);
document.getElementById('next').onclick=()=>{if(days){days=false;return render()}if(quick()||step===STEPS.length-1)return saveVisit(document.getElementById('next'));go(step+1)};
const APP_VERSION='v23';
let availableVersion='',checkingUpdate=false;
document.getElementById('appVersion').textContent='Version '+APP_VERSION;
function newerVersion(version){
 const parts=v=>/^v\d+(?:\.\d+){0,2}$/.test(v)?v.slice(1).split('.').map(Number):null;
 const next=parts(version),current=parts(APP_VERSION);if(!next)return false;
 for(let i=0;i<3;i++){const delta=(next[i]||0)-(current[i]||0);if(delta)return delta>0}return false
}
function refreshUpdateNotice(){
 document.getElementById('updateBanner').hidden=!availableVersion;
 if(!availableVersion)return;
 document.getElementById('updateVersions').textContent=`This phone: ${APP_VERSION} · Available: ${availableVersion}`;
 const button=document.getElementById('updateApp');button.disabled=!navigator.onLine;button.textContent=navigator.onLine?'Update now':'Connect to update';
}
async function checkUpdate(){
 refreshUpdateNotice();if(checkingUpdate||!navigator.onLine||location.hostname.endsWith('claude.ai'))return;
 checkingUpdate=true;
 try{const r=await fetch('version.json?'+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
  if(typeof j.v==='string'&&newerVersion(j.v))availableVersion=j.v;
  else if(j.v===APP_VERSION)availableVersion='';
  refreshUpdateNotice();
 }catch(e){}finally{checkingUpdate=false}
}
function applyUpdate(){
 if(!availableVersion||!navigator.onLine){refreshUpdateNotice();return}
 if(!save()){document.getElementById('updateMessage').textContent='Update paused: your latest changes could not be saved on this phone. Please keep this page open.';return}
 const button=document.getElementById('updateApp');button.disabled=true;button.textContent='Updating…';
 // A fresh navigation URL also bypasses older service workers' HTTP-cached HTML.
 const url=new URL(location.href);url.searchParams.set('app-update',availableVersion+'-'+Date.now());location.replace(url.href);
}
document.getElementById('updateApp').onclick=applyUpdate;
addEventListener('online',()=>{refreshSyncStatus();checkUpdate();push()});addEventListener('offline',()=>{refreshSyncStatus();refreshUpdateNotice()});setInterval(push,15*60e3);
setInterval(()=>{if(document.visibilityState==='visible')checkUpdate()},60e3);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){freshDate();refreshSyncStatus();checkUpdate();push()}});checkUpdate();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!location.hostname.endsWith('claude.ai'))navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
const freshDate=()=>{if(!S.editId&&!S.site&&!S.extra&&!S.state&&!S.trimmed&&!S.moved&&!S.armed&&!S.locked&&!S.batteriesChanged&&!S.cardChanged&&!S.settingsChanged&&!S.lensCleaned&&!S.pics&&!sum(S.out)&&S.date!==today()){S.date=today();const dateInput=document.querySelector('[data-f="date"]');if(dateInput)dateInput.value=S.date;save()}};freshDate();
render();push();
</script>
