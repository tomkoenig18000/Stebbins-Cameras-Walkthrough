<title>Camera Service Walkthrough</title>
<style>
:root{--bg:#f3f2ec;--surf:#fffefa;--ink:#262a22;--mute:#6b6f60;--line:#d9d8cc;--sage:#4f6b46;--sagebg:#e5ecdf;--straw:#e3c46b;--warn:#b1392b;--warnbg:#f7e3de;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#191b16;--surf:#23261f;--ink:#e8e7dc;--mute:#a3a693;--line:#3a3e33;--sage:#93b087;--sagebg:#27321f;--straw:#d9b95c;--warn:#e7786a;--warnbg:#3b2521}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#191b16;--surf:#23261f;--ink:#e8e7dc;--mute:#a3a693;--line:#3a3e33;--sage:#93b087;--sagebg:#27321f;--straw:#d9b95c;--warn:#e7786a;--warnbg:#3b2521}
*{box-sizing:border-box}
html,body,button,input,select,label{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);margin:0;padding:0 16px}
.app{max-width:480px;margin:0 auto;padding-block:12px 110px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
h1,h2{font-family:var(--disp);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:22px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}h2{font-size:30px}
.tag{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.app-heading{min-width:0;display:grid;gap:3px}.app-version{font:500 12px var(--mono);color:var(--mute)}
.pill{white-space:nowrap;font:600 12px var(--body);border-radius:99px;padding:4px 10px;background:var(--sagebg);color:var(--sage);border:0;cursor:pointer}
.pill.q{background:var(--warnbg);color:var(--warn)}
.sync-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--mute);white-space:nowrap;cursor:default}
.sync-status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--sage);flex:none}.sync-status.pending::before{background:var(--straw)}
.chips{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.chips[hidden]{display:none}
.chips button{flex:0 0 auto;font:600 12px var(--body);border:1px solid var(--line);background:var(--surf);color:var(--mute);border-radius:99px;padding:5px 10px;cursor:pointer}
.chips button.done{background:var(--sagebg);color:var(--sage);border-color:transparent}
.chips button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.hint{font-size:14px;color:var(--mute);margin:0}
label{display:grid;gap:4px;font-size:14px;font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=password],select,textarea{font:16px var(--body);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
label,.row>*{min-width:0}
input,select{max-width:100%;min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:44px;line-height:22px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{flex:1;font:600 14px var(--body);border:0;border-radius:8px;padding:8px;background:none;color:var(--mute);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--surf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.param{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:14px;font-weight:400}
.param small{display:block;color:var(--mute);font-size:12px}
.recs{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{font:600 14px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sage);color:var(--bg);border-color:var(--sage)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.check input{width:22px;height:22px;margin:0;accent-color:var(--sage);flex:none}
.check.photo{border-color:var(--straw)}
.count{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.count .v{font:700 16px var(--disp);padding:4px 0;border-radius:6px 6px 0 0;color:#1e2119}
.count .n{font:600 20px var(--mono);border:1px solid var(--line);border-top:0;padding:6px 0;background:var(--bg);font-variant-numeric:tabular-nums}
.count input{width:100%;text-align:center;font:600 20px var(--mono);border:0;background:transparent;color:var(--ink);padding:0}
.count .pm{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;overflow:hidden}
.count .pm button{font:700 18px var(--body);border:0;background:var(--surf);color:var(--ink);padding:10px 0;cursor:pointer}
.count .pm button+button{border-left:1px solid var(--line)}
.c18{background:#8fb07f}.c17{background:#b7c98a}.c16{background:#e3c46b}.c15{background:#e0a072}.c0{background:#c76a5c}
.tot{font-size:13px;color:var(--mute)}.tot.bad{color:var(--warn);font-weight:600}
.alert{background:var(--warnbg);color:var(--warn);font-weight:600;padding:10px 12px;border-radius:8px;font-size:14px}
.ok{background:var(--sagebg);color:var(--sage);font-weight:600;padding:10px 12px;border-radius:8px;font-size:14px}
.info{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;display:grid;gap:2px}
.line{font:500 14px/1.5 var(--mono);background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px;word-break:break-word}

.drop input{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:480px;margin:0 auto;display:flex;gap:10px}
.bar button{flex:1;font:700 17px var(--disp);letter-spacing:.03em;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.bar button:disabled{opacity:.35;cursor:default}
.bar button.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.log{display:grid;gap:6px}
.foot{font-size:12px;color:var(--mute)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.mode-toggle{align-items:center;font-weight:600}.mode-toggle small{display:block;color:var(--mute);font-weight:400;margin-top:2px}
.quick-actions{display:grid;gap:8px}.quick-actions .check{align-items:center;min-height:46px}
.quick-notes{resize:vertical;min-height:84px}.quick-section{border:0;padding:0;margin:0;min-width:0;display:grid;gap:8px}.quick-section legend{padding:0;margin-bottom:8px}
.arrival-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.arrival-options button{min-height:44px;text-align:left}
.top .pill{padding:7px 12px;border:1px solid var(--line);background:var(--surf);color:var(--ink)}
.card{box-shadow:0 2px 12px rgba(0,0,0,.035)}.quick-actions .check{background:var(--bg);border-color:transparent}.quick-actions .check:has(input:checked){background:var(--sagebg);border-color:var(--sage)}
.check.photo{border-color:var(--straw);background:var(--surf)}.check:focus-within{outline:2px solid var(--sage);outline-offset:2px}
.home-intro{display:grid;gap:5px}.home-intro h2{font-size:28px}.mode-options{display:grid;gap:8px}.mode-options .check{margin:0}
.card details>summary{cursor:pointer;font-size:14px;color:var(--mute)}.card details[open]>.param{margin-block:12px}
.test-banner{border:1px solid #b67615;border-radius:10px;background:#ffdc91;color:#4b3008;padding:12px 14px;display:grid;gap:3px;font-size:13px}.test-banner strong{font-size:12px;letter-spacing:.08em}
.update-banner{position:sticky;top:8px;z-index:20;align-self:start;display:grid;gap:8px;padding:14px;border:2px solid #658bbb;border-radius:12px;background:#e8f1ff;color:#173557;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.update-banner[hidden]{display:none}.update-banner strong{font-size:18px}.update-banner p{margin:0;font-size:14px}.update-banner .update-versions{font-size:12px;font-weight:600}
.update-banner button{min-height:44px;padding:10px 14px;border:0;border-radius:8px;background:#224d7e;color:#fff;font:700 16px var(--body);cursor:pointer}.update-banner button:disabled{opacity:.65;cursor:default}.update-banner button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .update-banner{background:#24364b;color:#e0edff;border-color:#779ec9}}
:root[data-theme="dark"] .update-banner{background:#24364b;color:#e0edff;border-color:#779ec9}
.test-banner[hidden]{display:none}.test-badge{display:inline-block;background:#ffdc91;color:#4b3008;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;margin-left:6px}
:root[data-testing="true"]{--bg:#fff1d4;--surf:#fffaf0;--ink:#493316;--mute:#7b633d;--line:#dfc89f;--sage:#805813;--sagebg:#f6e1b7;--straw:#bd7f1c}
@media(prefers-color-scheme:dark){:root[data-testing="true"]:not([data-theme="light"]){--bg:#2b2114;--surf:#382a19;--ink:#fff0d4;--mute:#cfb891;--line:#695035;--sage:#e2b15b;--sagebg:#4d391d;--straw:#e2b15b}}
:root[data-theme="dark"][data-testing="true"]{--bg:#2b2114;--surf:#382a19;--ink:#fff0d4;--mute:#cfb891;--line:#695035;--sage:#e2b15b;--sagebg:#4d391d;--straw:#e2b15b}
</style>

<div class="app">
 <div class="top"><div class="app-heading"><h1 id="siteTag">Camera service</h1><span class="app-version" id="appVersion">Version v17</span></div><span style="display:flex;gap:10px;align-items:center"><button class="pill" id="daysBtn">Home</button><span class="sync-status" id="syncPill" role="status" aria-live="polite">Synced</span></span></div>
 <section class="update-banner" id="updateBanner" role="status" aria-live="polite" hidden><strong>App update available</strong><p class="update-versions" id="updateVersions"></p><p id="updateMessage">Update before your next visit. Your current visit and saved entries will be kept on this phone.</p><button id="updateApp" type="button">Update now</button></section>
 <div class="test-banner" id="modeBanner" role="status" hidden><strong>TEST MODE</strong><span>Practice visits are flagged in the log and excluded from camera status and ArcGIS.</span></div>
 <nav class="chips" id="chips" aria-label="Steps"></nav>
 <main id="view"></main>
</div>
<div class="bar"><div><button id="back">‹ Back</button><button id="next" class="go">Next ›</button></div></div>

<script>
// Active site list from the Cameras tab (2026-10-27), alphabetized: name, camera, brand, last settings, usual interval (wk). No coordinates or lock codes.
const SITES=[["Annie's Junction","QR10","R","Delay 2 min (8/26)",8],["Annie's Rock Junction","QR7","R","Delay 2 min (8/26)",8],["Big Pool","QR3","R","?",12],["Coolers Bench","NRS 12","B","Delay 1 min (9/2)",6],["Cottonwood Confluence","CSS6","R","?",8],["Coyote Canyon Mouth","QR9","R","?",8],["East Homestead (Steve's Cam)","CT4","R","?",12],["High Coyote Canyon","CSS3","R","Pause 1 min (6/14)",10],["Lion Pool","QR6","R","?",12],["Live Oak","QRL4","R","Video OFF (9/2)",12],["Lower Wildhorse","HP4K2","R","?",12],["Middle Coyote Canyon Buckeye","NRS 06","B","2-shot, 5 min delay (9/2)",8],["Middle Coyote Canyon Toyon","NRS 04","B","Trail cam, 80 ft, 5 min delay, 3-shot (6/24)",8],["North Homestead","HP4K3","R","Pause 1 min; video OFF (9/2)",8],["Ridge","CT3","R","?",12],["Riverlapse","NRS 14","B","Timelapse+ 30 min?",8],["Scout's Chair","QR1","R","Delay 0? — check",8],["Sentinel Site","CRR-2-ML","R","?",8],["South Point","QR2","R","Check delay (quiet 1 min set 5/2025)",8],["Spencer","CSS4","R","?",12],["Stone Bridge","NG24","R","?",8],["Test Site 4","CSS2","R","?",8],["Toponce","CJT2","R","?",12],["Upper Cold Canyon","CT2","R","Delay 1 min (6/13)",12]];
const STEPS=[{k:'arrive',t:'Arrive'},{k:'batt',t:'Batteries'},{k:'card',t:'Card'},{k:'set',t:'Settings'},{k:'trim',t:'Trim'},{k:'pos',t:'Reposition'},{k:'arm',t:'Arm & lock'},{k:'notes',t:'Save'}];
const PDEF={highRate:2000,stopDays:7,targetFill:80,defaultWeeks:8,recDelay:1,delayFactor:35,videoFactor:25,trimFactor:80};
const PINFO=[['highRate','High trigger rate','pictures a week that counts as too many'],['stopDays','Stopped-early warning','days between the last picture and the visit'],['targetFill','Target card fill','% full the card should be at the next visit'],['defaultWeeks','Default interval','weeks to the next visit when the site has none'],['recDelay','Suggested delay','minutes, when the delay was 0'],['delayFactor','Delay added','% of pictures left after going from no delay to a delay'],['videoFactor','Video turned off','% of card space left after turning video off'],['trimFactor','Vegetation trimmed','% of pictures left after trimming']];
const V=['1.8','1.7','1.6','1.5','dead'],VC=['c18','c17','c16','c15','c0'];
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
const blank=()=>({date:today(),site:'',other:'',brand:'R',state:'',unlocked:false,obs:'',out:[0,0,0,0,0],inMode:'',inn:[0,0,0,0,0],pics:'',gb:'',size:'',weeks:'',first:'',last:'',imported:false,newCard:'',nextWeeks:'',delayFrom:'',delayTo:'',video:'',other2:'',clock:false,trimmed:false,trimNote:'',trimPhoto:false,moved:false,photoPlace:false,photoView:false,armed:false,locked:false,extra:'',batteriesChanged:false,cardChanged:false,settingsChanged:false,photosTaken:false});
let P={...PDEF},homeTab='visits',stash=null,flash='',pushing=false,S,step=0,days=false,dayPick='',queue=[],sent=[],cfg={url:'',key:''},showCfg=false;
const L=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
S=L('cam-visit')||blank();queue=L('cam-queue')||[];sent=L('cam-sent')||[];cfg=L('cam-cfg')||cfg;P={...PDEF,...(L('cam-params')||{})};step=L('cam-step')||0;stash=L('cam-stash');
let streamlined=L('cam-streamlined')!==false,testing=L('cam-testing')===true;
const isTestVisit=()=>testing||S.test===true;
// Every upload before v16 was a user-confirmed test. Preserve this on retries and edits.
for(const r of [...queue,...sent])if(typeof r.test!=='boolean'){r.test=true;r.type='Test';r.notes='[TEST] '+(r.notes||'');r.line='[TEST] '+(r.line||'');if(r.st)r.st.test=true}
// Keep a pre-update detailed draft in its original form. New visits default to quick mode.
if(!S.formMode&&(S.editId||S.pics||S.gb||S.newCard||S.inMode||S.out.some(Boolean)||S.inn.some(Boolean)))S.formMode='detailed';
const quick=()=>S.formMode?S.formMode==='quick':streamlined;
const save=()=>{try{localStorage.setItem('cam-visit',JSON.stringify(S));localStorage.setItem('cam-queue',JSON.stringify(queue));localStorage.setItem('cam-sent',JSON.stringify(sent.slice(-300)));localStorage.setItem('cam-cfg',JSON.stringify(cfg));localStorage.setItem('cam-params',JSON.stringify(P));localStorage.setItem('cam-step',step);localStorage.setItem('cam-stash',JSON.stringify(stash));localStorage.setItem('cam-streamlined',JSON.stringify(streamlined));localStorage.setItem('cam-testing',JSON.stringify(testing));return true}catch(e){return false}};
const nb=()=>S.brand==='B'?6:12;
const site=()=>S.site==='__other'?S.other.trim():S.site;
const siteInfo=()=>SITES.find(s=>s[0]===S.site);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
function grp(a,dir){if(!sum(a))return'';const n=a.map((c,i)=>c?`${c} ${V[i]}`:'').filter(Boolean);
 if(n.length===1&&sum(a)===nb())return`all ${n[0].split(' ')[1]} ${dir}`;return n.join(', ')+' '+dir}
function calcWeeks(){if(!S.first||!S.last)return'';const w=(new Date(S.last+'T12:00')-new Date(S.first+'T12:00'))/6048e5;return w>=0?String(Math.round(w*10)/10):''}
function daysAgo(d){return d?Math.round((new Date((S.date||today())+'T12:00')-new Date(d+'T12:00'))/864e5):null}
const SIZES=[32,64,128,256,512];
function nextW(){const si=siteInfo();return +S.nextWeeks||(si&&si[4])||P.defaultWeeks}
function factor(){let f=1;const why=[];if(S.delayFrom!==''&&+S.delayFrom===0&&+S.delayTo>0){f*=P.delayFactor/100;why.push('delay added')}
 if(S.video==='off'){f*=P.videoFactor/100;why.push('video off')}if(S.trimmed){f*=P.trimFactor/100;why.push('trimmed')}return{f,why}}
function proj(){const g=+S.gb,w=+S.weeks;if(!(g>0&&w>0))return null;const {f,why}=factor(),n=nextW(),need=g/w*f*n,cap=P.targetFill/100;
 const rec=SIZES.find(z=>need<=z*cap);return{need,n,why,rec,maxW:Math.floor(SIZES[SIZES.length-1]*cap/(g/w*f))}}
function projHtml(){const p=proj();if(!p)return'<p class="hint">Enter GB used and both picture dates to get a card size for next time.</p>';
 const lead=`About ${p.need<10?p.need.toFixed(1):Math.round(p.need)} GB over the next ${p.n} weeks${p.why.length?' ('+p.why.join(', ')+')':''}.`;
 if(!p.rec)return`<div class="alert">${lead} Even a ${SIZES[SIZES.length-1]} GB card would fill. Come back within ${p.maxW} weeks or cut the trigger rate.</div>`;
 const low=S.newCard&&+S.newCard<p.rec;return`<div class="${low?'alert':'info'}" style="display:block">${lead}<br><b>Suggested card: ${p.rec} GB</b>${low?` (you put in ${S.newCard})`:''}</div>`}
function recs(){const r=[],pw=S.pics&&+S.weeks>0?S.pics/S.weeks:0,d=daysAgo(S.last),hasDelay=+S.delayTo>0||(S.delayTo===''&&+S.delayFrom>0);
 if(pw>P.highRate&&!hasDelay)r.push(`Set a delay of at least ${P.recDelay} min. It's taking about ${Math.round(pw)} pictures a week.`);
 if(!S.video&&proj()&&!proj().rec)r.push('If video is on, turning it off saves the most card space.');
 if(pw>P.highRate&&!S.trimmed)r.push('Trim anything moving in the frame.');
 if(pw&&pw*factor().f>P.highRate&&hasDelay)r.push(`Even with these changes it may take over ${P.highRate} a week. Try a longer delay.`);
 if(d!=null&&d>P.stopDays&&S.state==='Dead')r.push('It died early. Use a full set of fresh 1.8s.');
 return r}
function settingsText(){if(quick())return S.settingsChanged?'Settings changed (details not recorded)':'';const p=[];if(S.delayTo!==''&&S.delayFrom!==S.delayTo)p.push(`Delay ${S.delayFrom===''?'?':S.delayFrom} → ${S.delayTo} min`);
 if(S.video==='off')p.push('Video turned off');if(S.video==='on')p.push('Video left on');if(S.other2)p.push(S.other2);if(S.brand==='B'&&S.clock)p.push('Clock checked');return p.join('; ')}
function notesText(){const p=[];if(S.obs)p.push(S.obs);if(quick()){if(S.batteriesChanged)p.push('Batteries changed');if(S.cardChanged)p.push('Card changed');if(S.settingsChanged)p.push('Settings changed');if(S.trimmed)p.push('Trimmed vegetation');if(S.moved)p.push('Repositioned');if((S.trimmed||S.moved)&&S.photosTaken)p.push('Photos taken');if(S.armed)p.push('Armed');if(S.locked)p.push('Locked')}else{if(S.trimmed)p.push(S.trimNote?`Cleared ${S.trimNote}`:'Trimmed vegetation');if(S.moved)p.push('Repositioned')}if(S.extra)p.push(S.extra);return p.join('. ')}
function line(){return (isTestVisit()?'[TEST] ':'')+visitLine()}
function visitLine(){if(quick())return `${site()||'[site?]'}: ${[S.state?S.state.toLowerCase()+' on arrival':'',notesText()].filter(Boolean).join(', ')}`;const p=[],o=grp(S.out,'out'),n=S.inMode?`all ${S.inMode} in`:grp(S.inn,'in');if(o)p.push(o);if(n)p.push(n);
 if(S.pics||S.gb){let c=`${S.pics||'?'} for ${S.gb||'?'} gb on ${S.size||'?'}`;if(S.weeks)c+=` in ${S.weeks} weeks`;if(S.state==='Card full'||S.state==='Dead')c+=` (${S.state.toLowerCase()})`;p.push(c)}
 else if(S.state==='Card full'||S.state==='Dead')p.push(S.state.toLowerCase()+' on arrival');

function renderDays(){const all=[...sent.map(r=>({...r,up:1})),...queue.map(r=>({...r,up:0}))];

function readCard(e){const f=[...e.target.files].filter(x=>/\.(jpe?g|mp4|avi|mov)$/i.test(x.name));if(!f.length)return;
 const iso=ms=>ymd(new Date(ms));
 const ph=f.filter(x=>/\.jpe?g$/i.test(x.name));if(!ph.length)return;const pt=ph.map(x=>x.lastModified).sort((a,b)=>a-b);
 S.pics=String(ph.length);S.gb=(sum(f.map(x=>x.size))/1e9).toFixed(1);S.first=iso(pt[0]);S.last=iso(pt[pt.length-1]);
 S.weeks=calcWeeks();S.imported=true;render()}

async function push(){if(pushing||!queue.length||!cfg.url||!navigator.onLine)return;pushing=true;const batch=queue.slice();
 const m=document.getElementById('syncMsg');if(m)m.textContent='Uploading…';
 try{if(batch.some(r=>r.test)){
   const cap=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:cfg.key,action:'capabilities'})});
   let support;try{support=JSON.parse(await cap.text())}catch(e){}if(!support?.capabilities?.testMode)throw new Error('the log connection needs its testing-mode update before test visits can upload');
  }const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:cfg.key,rows:batch})});
  const tx=await r.text();let j;try{j=JSON.parse(tx)}catch(e){throw new Error('the log sent back a web page, not a reply. Check the address and that access is set to Anyone')}if(!j.ok)throw new Error(j.error||'rejected');
  const done=new Set(j.saved||batch.map(q=>q.id)),ok=q=>done.has(q.id)&&batch.includes(q);sent.push(...queue.filter(ok));queue=queue.filter(q=>!ok(q));render();
  const m2=document.getElementById('syncMsg');if(m2)m2.textContent=`Uploaded to the Camera Log.`}
 catch(err){const sp=document.getElementById('syncPill');if(sp&&!days)sp.textContent='Upload failed';const m3=document.getElementById('syncMsg');if(m3)m3.textContent=`Couldn't upload (${err.message}). Visits are kept and will try again.`}
 finally{pushing=false}}

 if(b.dataset.tab){homeTab=b.dataset.tab;return render()}

 if(b.dataset.open){const r=[...queue,...sent].find(x=>x.id===b.dataset.open);if(r&&r.st){if(!S.editId&&(S.site||S.extra||S.pics||sum(S.out)))stash={S:JSON.parse(JSON.stringify(S)),step};S={...blank(),...JSON.parse(JSON.stringify(r.st)),formMode:r.st.formMode||'detailed',editId:r.id};days=false;step=STEPS.length-1;render();window.scrollTo(0,0);return}}

 if(b.dataset.seg){const f=b.dataset.seg;S[f]=(S[f]===b.dataset.v&&f!=='brand'&&f!=='inMode')?'':b.dataset.v;return render()}

 if(b.id==='discard'){if(!b.dataset.arm){b.dataset.arm=Date.now();b.textContent='Tap again to discard';return}if(Date.now()-b.dataset.arm<700)return;const wasEdit=S.editId;S=blank();step=0;if(wasEdit&&stash){S=stash.S;step=stash.step;stash=null}flash=wasEdit?'Edit discarded. The saved visit is unchanged.':'Visit discarded.';return render()}
 if(b.id==='pushNow')return push();

 if(b.id==='cfgTest'){const u=document.getElementById('cfgUrl').value.trim(),k=document.getElementById('cfgKey').value;alertMsg('Testing…');fetch(u+(u.includes('?')?'&':'?')+'key='+encodeURIComponent(k)).then(r=>r.text()).then(t=>{let j;try{j=JSON.parse(t)}catch(e){throw new Error('got a web page instead of the log. Check the address ends in /exec and access is set to Anyone')}alertMsg(j.ok?'Connected to '+j.sheet+'.':'The log answered: '+j.error)}).catch(err=>alertMsg('Test failed: '+err.message));return}
 if(b.id==='cfgSave'){cfg={url:document.getElementById('cfgUrl').value.trim(),key:document.getElementById('cfgKey').value};showCfg=false;render();push()}

function saveVisit(b){if(!S.date)S.date=today();if(!site()){step=0;flash='Choose a site first.';return render()}
 if(missing().length){if(!b.dataset.arm){b.dataset.arm=Date.now();b.textContent='Save anyway?';if(quick())alertMsg('Still unchecked: '+missing().join(', ')+'. Tap again to save anyway.');return}if(Date.now()-b.dataset.arm<700)return}

const APP_VERSION='v17';
let availableVersion='',checkingUpdate=false;
document.getElementById('appVersion').textContent='Version '+APP_VERSION;
function newerVersion(version){
 const parts=v=>/^v\d+(?:\.\d+){0,2}$/.test(v)?v.slice(1).split('.').map(Number):null;
 const next=parts(version),current=parts(APP_VERSION);if(!next)return false;
 for(let i=0;i<3;i++){const delta=(next[i]||0)-(current[i]||0);if(delta)return delta>0}return false
}
function refreshUpdateNotice(){
 document.getElementById('updateBanner').hidden=!availableVersion;
 if(!availableVersion)return;
 document.getElementById('updateVersions').textContent=`This phone: ${APP_VERSION} · Available: ${availableVersion}`;
 const button=document.getElementById('updateApp');button.disabled=!navigator.onLine;button.textContent=navigator.onLine?'Update now':'Connect to update';
}
async function checkUpdate(){
 refreshUpdateNotice();if(checkingUpdate||!navigator.onLine||location.hostname.endsWith('claude.ai'))return;
 checkingUpdate=true;
 try{const r=await fetch('version.json?'+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
  if(typeof j.v==='string'&&newerVersion(j.v))availableVersion=j.v;
  else if(j.v===APP_VERSION)availableVersion='';
  refreshUpdateNotice();
 }catch(e){}finally{checkingUpdate=false}
}
function applyUpdate(){
 if(!availableVersion||!navigator.onLine){refreshUpdateNotice();return}
 if(!save()){document.getElementById('updateMessage').textContent='Update paused: your latest changes could not be saved on this phone. Please keep this page open.';return}
 const button=document.getElementById('updateApp');button.disabled=true;button.textContent='Updating…';
 // A fresh navigation URL also bypasses older service workers' HTTP-cached HTML.
 const url=new URL(location.href);url.searchParams.set('app-update',availableVersion+'-'+Date.now());location.replace(url.href);
}
document.getElementById('updateApp').onclick=applyUpdate;
addEventListener('online',()=>{render();checkUpdate();push()});addEventListener('offline',()=>{render();refreshUpdateNotice()});setInterval(push,15*60e3);
setInterval(()=>{if(document.visibilityState==='visible')checkUpdate()},60e3);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){freshDate();if(!days)render();checkUpdate();push()}});checkUpdate();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!location.hostname.endsWith('claude.ai'))navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
const freshDate=()=>{if(!S.editId&&!S.site&&!S.extra&&!S.state&&!S.trimmed&&!S.moved&&!S.armed&&!S.locked&&!S.batteriesChanged&&!S.cardChanged&&!S.settingsChanged&&!S.pics&&!sum(S.out))S.date=today()};freshDate();
render();push();
